default.description=暂无说明，请查阅 benchmarks/src 下同名 *Benchmark.kt 源码。

CommonCallsBenchmark.name=常见调用性能
CommonCallsBenchmark.description=编译器处理大量函数调用和属性访问时的分析速度。

SimpleDataFlowBenchmark.name=简单数据流
SimpleDataFlowBenchmark.description=编译器进行基础数据流分析（变量在函数间的传递追踪）的速度。

ComplexDataFlowBenchmark.name=复杂数据流
ComplexDataFlowBenchmark.description=编译器进行复杂数据流分析（变量赋值追踪、可达性分析）的速度。

ControlFlowOperators.name=控制流操作符
ControlFlowOperators.description=编译器分析控制流图（if/when/for/while 的跳转逻辑）的速度。

ControlFlowAnalysisBenchmark.name=深层嵌套控制流
ControlFlowAnalysisBenchmark.description=编译器分析深层嵌套 for 循环等控制流结构的分析速度。

ManyValsBenchmark.name=大量只读变量
ManyValsBenchmark.description=编译器处理大量只读变量声明时的分析速度。

ManyVarsBenchmark.name=大量可变变量
ManyVarsBenchmark.description=编译器处理大量可变变量声明时的分析速度。

IntArrayPlusBenchmark.name=Int 数组加法
IntArrayPlusBenchmark.description=编译器处理 IntArray 的 + 操作符重载解析的速度。

InferenceBaselineCallsBenchmark.name=类型推断基准
InferenceBaselineCallsBenchmark.description=编译器进行最基础类型推断（如 val x = 1 推断为 Int）的速度。

InferenceFromArgumentCallsBenchmark.name=从参数推断
InferenceFromArgumentCallsBenchmark.description=编译器根据函数参数推断类型参数（如 listOf(1,2,3) → List<Int>）的速度。

InferenceFromReturnTypeCallsBenchmark.name=从返回值推断
InferenceFromReturnTypeCallsBenchmark.description=编译器根据返回值推断类型参数（如 val x = foo() 反向推断）的速度。

InferenceExplicitArgumentsCallsBenchmark.name=显式参数类型推断
InferenceExplicitArgumentsCallsBenchmark.description=编译器处理显式类型参数（如 foo<Int>(x)）时的推断速度。

InferenceForInApplicableCandidate.name=不可用候选推断
InferenceForInApplicableCandidate.description=编译器尝试推断但失败时（无法找到合适重载）的性能。

ManyImplicitReceiversBenchmark.name=多层隐式接收者
ManyImplicitReceiversBenchmark.description=编译器解析多层嵌套隐式接收者（extension receiver）时的分析速度。

PlusAssignOperatorDesugaringBenchmark.name=plusAssign 运算符脱糖
PlusAssignOperatorDesugaringBenchmark.description=编译器处理复合赋值运算符（plusAssign）脱糖与重载解析时的分析速度。
