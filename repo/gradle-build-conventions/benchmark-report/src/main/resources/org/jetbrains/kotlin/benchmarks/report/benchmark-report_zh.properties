html.legend.name.body=各基准类在 benchmarks/src 中的业务含义与合成测试场景说明；参数列中的 isIR、size、useNI 见 README。
html.legend.verdict.title=结论
html.legend.verdict.regression=<b>变差</b> — 相对基线变化率 > +{0}%（即当前值比基线大，且超出阈值）。对 ms/op 而言，数字越大表示耗时越长、性能越慢。
html.legend.verdict.improvement=<b>变好</b> — 相对基线变化率 < -{0}%（即当前值比基线小，且超出阈值）。对 ms/op 而言，数字越小表示耗时越短、性能越快。
html.legend.verdict.neutral=<b>基本持平</b> — 相对基线变化在 ±{0}% 以内，视为波动、不算明显差异。
html.legend.verdict.baseline_only=<b>仅在基线中</b> — 基线 JSON 里有，这次跑分结果里没有。
html.legend.verdict.current_only=<b>仅在当前结果中</b> — 这次跑分有，基线 JSON 里没有（例如新加的测试）。
html.legend.note.title=说明
html.legend.note.lower=<b>数值越小越好（耗时越短越快）</b> — 常见 ms/op：分数小表示每次操作更快。
html.legend.note.higher=<b>数值越大越好（吞吐量越高越快）</b> — 吞吐量类指标。
html.legend.note.missing=<b>当前跑分里没有这一行 / 基线里没有这一行</b> — 只对「仅在一边有」的行出现。

